name: Capture localized screenshots

on:
  workflow_dispatch:
    inputs:
      locales:
        description: 'Space-separated list of locales to capture (e.g. "en ja ar"). Leave empty to run all locales in the test plan.'
        required: false
        default: ''
      ipad:
        description: 'Set to "true" to capture iPad shots (sets IPAD=1).'
        required: false
        default: 'false'
      widgets_only:
        description: 'Set to "true" to re-render only widgets (sets WIDGETS_ONLY=1).'
        required: false
        default: 'false'

jobs:
  capture-all-platforms:
    name: Build & capture screenshots (iOS / iPad / macOS / watchOS / visionOS)
    runs-on: macos-26
    timeout-minutes: 240

    # Nothing built here is distributed: the simulator targets never verify a
    # signature, and the Mac app only has to launch on this runner. Ad-hoc
    # signing keeps the job free of certificates and profiles entirely. The
    # entitlements that need a profile (iCloud, APNs, app groups) go inert, which
    # the capture path already tolerates — it runs on an in-memory store with
    # CloudKit disabled, and every app-group read is nil-guarded.
    env:
      AD_HOC_SIGNING: >-
        CODE_SIGN_STYLE=Manual
        CODE_SIGN_IDENTITY=-
        PROVISIONING_PROFILE_SPECIFIER=

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show environment
        run: |
          xcodebuild -version
          xcrun --version
          sw_vers

      - name: Make scripts executable
        run: chmod +x Scripts/*.sh

      # Secrets.swift is gitignored, so the checkout has no copy and every target
      # fails to compile without one. Mirrors ci_scripts/ci_post_clone.sh, which
      # does the same for Xcode Cloud. The key only powers the in-app feedback
      # form, which no screenshot exercises, so a placeholder is enough.
      - name: Generate Secrets.swift
        env:
          YAPKIT_API_KEY: ${{ secrets.YAPKIT_API_KEY }}
        run: |
          set -euo pipefail
          cat > Solstice/Helpers/Secrets.swift << EOF
          //
          //  Secrets.swift
          //  Solstice
          //
          //  Auto-generated by .github/workflows/capture-screenshots.yml — DO NOT COMMIT
          //

          import Foundation

          enum Secrets {
          	static let yapKitAPIKey = "${YAPKIT_API_KEY:-MISSING_API_KEY}"
          }
          EOF

      # ---- Pre-build for macOS (required by macOS capture script) ----
      - name: Build macOS app for screenshots
        run: |
          set -euo pipefail
          echo "Building macOS app for screenshot capture (DerivedData-mac)"
          # shellcheck disable=SC2086  # AD_HOC_SIGNING is a list of build settings
          xcodebuild build -project Solstice.xcodeproj -scheme Screenshots \
            -destination 'platform=macOS' \
            -derivedDataPath .screenshots/DerivedData-mac \
            $AD_HOC_SIGNING

      # ---- Pre-build for watchOS simulator (required by watchOS capture script) ----
      # Generic simulator destinations: the capture scripts pick their own device
      # by name at run time, so pinning a device or an OS version here only adds a
      # way for the build to fail on a runner image that ships different runtimes.
      - name: Build watchOS app for simulator
        run: |
          set -euo pipefail
          echo "Building watchOS Watch App for simulator (DerivedData-watchos)"
          xcodebuild build -project Solstice.xcodeproj -scheme "Solstice watchOS Watch App" \
            -destination "generic/platform=watchOS Simulator" \
            -derivedDataPath .screenshots/DerivedData-watchos

      # ---- Pre-build for visionOS simulator (required by visionOS capture script) ----
      - name: Build visionOS app for simulator
        run: |
          set -euo pipefail
          echo "Building visionOS app for simulator (DerivedData-visionos)"
          xcodebuild build -project Solstice.xcodeproj -scheme Solstice \
            -destination "generic/platform=visionOS Simulator" \
            -derivedDataPath .screenshots/DerivedData-visionos

      # ---- Run iOS/iPad/widgets capture script (uses test plan & xcresulttool) ----
      # The locales input reaches the scripts through the environment, never
      # through ${{ }} interpolation into the shell: interpolation would splice
      # the raw input into the command line. Deliberately unquoted below — the
      # scripts take one locale per argument, and an empty value means "all".
      - name: Run iOS / iPad / Widgets capture
        env:
          LOCALES: ${{ inputs.locales }}
          IPAD: ${{ inputs.ipad == 'true' && '1' || '0' }}
          WIDGETS_ONLY: ${{ inputs.widgets_only == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          echo "=== Running iOS capture script ==="
          # shellcheck disable=SC2086
          ./Scripts/capture-screenshots.sh $LOCALES

      # ---- Run macOS capture script (window captures) ----
      - name: Run macOS capture script
        env:
          LOCALES: ${{ inputs.locales }}
        run: |
          set -euo pipefail
          echo "=== Running macOS capture script ==="
          # shellcheck disable=SC2086
          ./Scripts/capture-screenshots-macos.sh $LOCALES

      # ---- Run watchOS capture script ----
      - name: Run watchOS capture script
        env:
          LOCALES: ${{ inputs.locales }}
        run: |
          set -euo pipefail
          echo "=== Running watchOS capture script ==="
          # shellcheck disable=SC2086
          ./Scripts/capture-screenshots-watchos.sh $LOCALES

      # ---- Run visionOS capture script ----
      - name: Run visionOS capture script
        env:
          LOCALES: ${{ inputs.locales }}
        run: |
          set -euo pipefail
          echo "=== Running visionOS capture script ==="
          # shellcheck disable=SC2086
          ./Scripts/capture-screenshots-visionos.sh $LOCALES

      # Both run even on failure. The capture scripts write each shot as they go,
      # so a run that dies on the last platform still has usable output from the
      # earlier ones — discarding it would mean re-running the whole job.
      - name: List captured screenshots
        if: always()
        run: |
          echo "=== Screenshots output ==="
          ls -la Screenshots/output || true
          find Screenshots/output -type f -name '*.png' -print || true

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: Screenshots/output
          if-no-files-found: warn

      # Uploaded even on failure: the bundle holds the test log and the
      # attachments captured before the run stopped, which is what a failed run
      # needs. The DerivedData trees are not uploaded — several GB of build
      # products that say nothing the job log doesn't.
      - name: Upload xcresult bundle (raw test results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: .screenshots/results
          if-no-files-found: warn
