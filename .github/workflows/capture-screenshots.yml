name: Capture localized screenshots

on:
  workflow_dispatch:
    inputs:
      locales:
        description: 'Space-separated list of locales to capture (e.g. "en ja ar"). Leave empty to run all locales in the test plan.'
        required: false
        default: ''
      ipad:
        description: 'Set to "true" to capture iPad shots (sets IPAD=1).'
        required: false
        default: 'false'
      widgets_only:
        description: 'Set to "true" to re-render only widgets (sets WIDGETS_ONLY=1).'
        required: false
        default: 'false'

jobs:
  # One job per platform, run concurrently. Sequentially the run costs the sum of
  # all four platforms; this way it costs the slowest one, which is visionOS by a
  # wide margin (simulator boot alone is ~5.5 min, and the first launch another
  # ~6). Roughly the same total runner minutes, a fraction of the wall clock.
  #
  # fail-fast is off deliberately: a platform that cannot capture should not take
  # the other three down with it, on a job this long.
  capture:
    name: Capture ${{ matrix.label }}
    runs-on: macos-26
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            label: iOS / iPad / widgets
          - platform: macos
            label: macOS
          - platform: watchos
            label: watchOS
          - platform: visionos
            label: visionOS

    # Nothing built here is distributed: the simulator targets never verify a
    # signature, and the Mac app only has to launch on this runner. Ad-hoc
    # signing keeps the job free of certificates and profiles entirely.
    #
    # The entitlements have to go with them. Solstice claims restricted ones
    # (iCloud, APNs, associated domains, app groups) that only a provisioning
    # profile can authorize; ad-hoc signed, AMFI refuses to spawn the process at
    # all — "Launchd job spawn failed" — and every macOS window capture comes
    # back empty. Dropping them is safe for capture: the app is not sandboxed,
    # screenshot mode runs on an in-memory store with CloudKit disabled, and
    # every app-group read is nil-guarded.
    env:
      AD_HOC_SIGNING: >-
        CODE_SIGN_STYLE=Manual
        CODE_SIGN_IDENTITY=-
        PROVISIONING_PROFILE_SPECIFIER=
        CODE_SIGN_ENTITLEMENTS=
      # Keeps package checkouts in a fixed, cacheable directory instead of
      # burying them in a per-platform DerivedData tree.
      XCODEBUILD_EXTRA_ARGS: -clonedSourcePackagesDirPath .spm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          xcodebuild -version
          sw_vers

      # Checkouts only. Caching the built products would save more, but a stale
      # DerivedData cache fails as a compile error that reads like a code bug.
      - name: Cache Swift package checkouts
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('Solstice.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Make scripts executable
        run: chmod +x Scripts/*.sh

      # Secrets.swift is gitignored, so the checkout has no copy and every target
      # fails to compile without one. Mirrors ci_scripts/ci_post_clone.sh, which
      # does the same for Xcode Cloud. The key only powers the in-app feedback
      # form, which no screenshot exercises, so a placeholder is enough.
      - name: Generate Secrets.swift
        env:
          YAPKIT_API_KEY: ${{ secrets.YAPKIT_API_KEY }}
        run: |
          set -euo pipefail
          cat > Solstice/Helpers/Secrets.swift << EOF
          //
          //  Secrets.swift
          //  Solstice
          //
          //  Auto-generated by .github/workflows/capture-screenshots.yml — DO NOT COMMIT
          //

          import Foundation

          enum Secrets {
          	static let yapKitAPIKey = "${YAPKIT_API_KEY:-MISSING_API_KEY}"
          }
          EOF

      # ---- Pre-builds. iOS has none: `xcodebuild test` builds what it needs. ----
      # Generic simulator destinations: the capture scripts pick their own device
      # by name at run time, so pinning a device or an OS version here only adds a
      # way for the build to fail on a runner image that ships different runtimes.
      - name: Build macOS app
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # both are flag lists, not single arguments
          xcodebuild build -project Solstice.xcodeproj -scheme Screenshots \
            -destination 'platform=macOS' \
            -derivedDataPath .screenshots/DerivedData-mac \
            $XCODEBUILD_EXTRA_ARGS $AD_HOC_SIGNING

      - name: Build watchOS app
        if: matrix.platform == 'watchos'
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          xcodebuild build -project Solstice.xcodeproj -scheme "Solstice watchOS Watch App" \
            -destination "generic/platform=watchOS Simulator" \
            -derivedDataPath .screenshots/DerivedData-watchos \
            $XCODEBUILD_EXTRA_ARGS

      - name: Build visionOS app
        if: matrix.platform == 'visionos'
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          xcodebuild build -project Solstice.xcodeproj -scheme Solstice \
            -destination "generic/platform=visionOS Simulator" \
            -derivedDataPath .screenshots/DerivedData-visionos \
            $XCODEBUILD_EXTRA_ARGS

      # ---- Capture. ----
      # The locales input reaches the scripts through the environment, never
      # through ${{ }} interpolation into the shell: interpolation would splice
      # the raw input into the command line. Deliberately unquoted below — the
      # scripts take one locale per argument, and an empty value means "all".
      - name: Capture ${{ matrix.label }}
        env:
          LOCALES: ${{ inputs.locales }}
          IPAD: ${{ inputs.ipad == 'true' && '1' || '0' }}
          WIDGETS_ONLY: ${{ inputs.widgets_only == 'true' && '1' || '0' }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            ios) script=Scripts/capture-screenshots.sh ;;
            *)   script="Scripts/capture-screenshots-$PLATFORM.sh" ;;
          esac
          echo "=== $script ==="
          # shellcheck disable=SC2086
          "./$script" $LOCALES

      - name: List captured screenshots
        if: always()
        run: |
          find Screenshots/output -type f -name '*.png' -print || true

      # Per-platform artifacts, merged into a single "screenshots" artifact below
      # so consumers still see the one bundle they saw when this was a single job.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.platform }}
          path: Screenshots/output
          if-no-files-found: warn

      # Only the iOS path produces one — it is the only platform driven by
      # `xcodebuild test` rather than a simctl/open script.
      - name: Upload xcresult bundle
        if: always() && matrix.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: .screenshots/results
          if-no-files-found: warn

  merge-screenshots:
    name: Merge screenshot artifacts
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    # A platform that captured nothing leaves no artifact to merge. That failure
    # is already reported by its own job; do not double-report it here.
    continue-on-error: true
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: screenshots
          pattern: screenshots-*
          delete-merged: true
