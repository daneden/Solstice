name: (temporary) macOS GUI session probe

# Answers one question: can a GitHub macOS runner launch a Mac GUI app and see
# its window at all? The screenshot job's macOS captures fail at `open` with
# "Launchd job spawn failed", which is either the ad-hoc signature being
# rejected or the absence of a GUI session. Calculator is Apple-signed, so if it
# fails too, the signature is not the cause. Delete this workflow once answered.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Session type
        run: |
          echo "managername: $(launchctl managername || true)"
          echo "WindowServer processes: $(pgrep -x WindowServer | wc -l | tr -d ' ')"
          echo "console user: $(stat -f%Su /dev/console || true)"
          echo "whoami: $(whoami)"

      - name: Launch Apple-signed GUI app and enumerate windows
        run: |
          set -uo pipefail
          cat > /tmp/winlist.swift <<'SWIFT'
          import CoreGraphics
          import Foundation
          let list = (CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as? [[String: Any]]) ?? []
          print("on-screen windows: \(list.count)")
          for w in list.prefix(20) {
          	let owner = w[kCGWindowOwnerName as String] as? String ?? "?"
          	let layer = w[kCGWindowLayer as String] as? Int ?? -1
          	print("  \(owner) layer=\(layer)")
          }
          SWIFT

          echo "--- before launch ---"
          swift /tmp/winlist.swift

          echo "--- open Calculator ---"
          open -n /System/Applications/Calculator.app; echo "open rc=$?"
          sleep 8

          echo "--- after launch ---"
          swift /tmp/winlist.swift
          pgrep -x Calculator >/dev/null && echo "Calculator IS running" || echo "Calculator is NOT running"

      - name: Can screencapture write a file
        run: |
          set -uo pipefail
          screencapture -x /tmp/probe.png; echo "screencapture rc=$?"
          ls -l /tmp/probe.png || echo "no file written"
